<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Z-Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Design/Functional_Files/functional.css">
  <link rel="stylesheet" href="../Design/Functional_Files/sweetalert-dark.css">
  <style>
    .report-table { white-space: nowrap; }
    @media print {
      #app-header, .no-print { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .table-dark { --bs-table-color: #000; --bs-table-bg: #fff; --bs-table-border-color: #777; }
      .card { background: #fff !important; color: #000 !important; border-color: #777 !important; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="container-fluid py-4">
  <div id="app-header"></div>

  <main>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 no-print">
      <div>
        <h2 class="mb-1">Daily Z-Report</h2>
        <p class="mb-0">End-of-day sales, tenders, receivables, and register cash reconciliation.</p>
      </div>
      <a href="pos.html" id="back-pos" class="btn btn-dark d-none">&larr; Back to POS</a>
    </div>

    <section class="card bg-dark text-light border-secondary mb-4">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
          <div>
            <h3 class="h5 mb-1">End-of-day report</h3>
            <div class="text-secondary">Shift opening date: <strong id="report-date">-</strong></div>
          </div>
          <div class="d-flex flex-wrap align-items-end gap-2 no-print">
            <div>
              <label for="dailyDate" class="form-label">Shift opening date</label>
              <input type="date" id="dailyDate" class="form-control">
            </div>
            <button type="button" id="dailyBtn" class="btn btn-primary">Generate Z-Report</button>
            <button type="button" id="printBtn" class="btn btn-secondary">Print</button>
          </div>
        </div>
        <div class="row g-3" id="sales-summary"></div>
      </div>
    </section>

    <div class="row g-4 mb-4">
      <div class="col-12 col-xl-6">
        <section class="card h-100 bg-dark text-light border-secondary">
          <div class="card-body">
            <h3 class="h5">Sales and AR summary</h3>
            <div id="sales-details"></div>
          </div>
        </section>
      </div>
      <div class="col-12 col-xl-6">
        <section class="card h-100 bg-dark text-light border-secondary">
          <div class="card-body">
            <h3 class="h5">POS payments by method</h3>
            <div id="payment-methods"></div>
          </div>
        </section>
      </div>
      <div class="col-12">
        <section class="card bg-dark text-light border-secondary">
          <div class="card-body">
            <h3 class="h5">Cash drawer reconciliation</h3>
            <div id="cash-drawer-summary"></div>
          </div>
        </section>
      </div>
    </div>

    <section class="card bg-dark text-light border-secondary">
      <div class="card-body">
        <h3 class="h5">Register shift breakdown</h3>
        <div class="table-responsive" id="shift-div"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../js_functional/session.js"></script>
  <script type="module" src="../../js_functional/daily_report.js"></script>
</body>
</html>
