<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Barcode Scanner</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../Design/Functional_Files/functional.css" />
    <style>
      body {
        min-height: 100vh;
        padding: 1rem;
      }

      .scanner-page {
        width: min(100%, 640px);
        margin: 2rem auto;
      }

      .scanner-card {
        padding: 1.25rem;
        border: 1px solid #2d394e;
        border-radius: 12px;
        background: #1b2433;
      }

      #barcode-video {
        width: 100%;
        min-height: 240px;
        max-height: 55vh;
        border-radius: 8px;
        background: #080b11;
        object-fit: cover;
      }

      .scanner-code {
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="scanner-page">
      <h1 class="mb-2">Phone Barcode Scanner</h1>
      <p>Pair this phone with the cashier POS, then scan products into its cart.</p>

      <div class="scanner-card">
        <div class="mb-3">
          <label for="pairing-code" class="form-label">POS pairing code</label>
          <input
            type="text"
            class="form-control scanner-code"
            id="pairing-code"
            inputmode="numeric"
            maxlength="8"
            autocomplete="one-time-code"
            placeholder="8-digit code"
          />
        </div>

        <div class="d-grid gap-2 mb-3">
          <button type="button" class="btn btn-success" id="start-scanner">
            Connect and Start Camera
          </button>
          <button type="button" class="btn btn-secondary" id="stop-scanner" disabled>
            Stop Camera
          </button>
        </div>

        <video id="barcode-video" playsinline muted></video>
        <p id="scanner-status" class="mt-3 mb-0" role="status">
          Enter the code shown on the POS.
        </p>

        <hr />
        <label for="manual-barcode" class="form-label">Manual barcode entry</label>
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            id="manual-barcode"
            placeholder="Enter barcode"
          />
          <button type="button" class="btn btn-outline-light" id="send-manual-barcode">
            Send
          </button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
    <script type="module" src="../../js_functional/barcode_scanner.js"></script>
  </body>
</html>
