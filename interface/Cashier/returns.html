<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Returns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div id="app-header"></div>
  <h3>Sales Return</h3>
  <input type="text" id="invoice-search" class="form-control mb-1" placeholder="Search invoice number or customer" autocomplete="off">
  <div id="invoice-results" class="list-group mb-2"></div>
  <div id="items-div"></div>
  <input type="text" id="return-reason" class="form-control mb-2" placeholder="Reason (e.g. Damaged product)">
  <button type="button" id="button-save-return" class="btn btn-primary">SAVE RETURN</button>
  <hr>
  <h5>Returns</h5>
  <div id="returns-div"></div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../js_functional/session.js"></script>
  <script type="module" src="../../js_functional/returns.js"></script>
</body>
</html>
