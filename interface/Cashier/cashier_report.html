<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cashier Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    table { white-space: nowrap; }
    @media print { #app-header, .no-print { display: none !important; } }
  </style>
</head>
<body class="container-fluid py-4">
  <div id="app-header"></div>

  <div class="d-flex justify-content-between align-items-center mb-4 no-print">
    <h2 class="mb-0">Cashier Report</h2>
    <a href="pos.html" id="back-pos" class="btn btn-dark d-none">&larr; Back to POS <span class="badge bg-light text-dark ms-2">Esc</span></a>
  </div>

  <h3>Shift Report</h3>
  <div class="row g-2 mb-3 no-print">
    <div class="col-auto"><input type="date" id="shiftFrom" class="form-control"></div>
    <div class="col-auto"><input type="date" id="shiftTo" class="form-control"></div>
    <div class="col-auto">
      <button type="button" id="shiftBtn" class="btn btn-primary">GENERATE</button>
      <button type="button" id="printBtn" class="btn btn-secondary">PRINT</button>
    </div>
  </div>
  <div class="table-responsive mb-5" id="shift-div"></div>

  <h3>Daily Report</h3>
  <div class="row g-2 mb-3 no-print">
    <div class="col-auto"><input type="date" id="dailyDate" class="form-control"></div>
    <div class="col-auto"><button type="button" id="dailyBtn" class="btn btn-primary">GENERATE</button></div>
  </div>
  <div class="table-responsive" id="daily-div"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../js_functional/session.js"></script>
  <script type="module" src="../../js_functional/cashier_report.js"></script>
</body>
</html>
