<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Design/Functional_Files/functional.css">
  <link rel="stylesheet" href="../Design/Functional_Files/sweetalert-dark.css">
  <link rel="stylesheet" href="../Design/Functional_Files/shift-report.css">
  <link rel="stylesheet" href="../Design/Functional_Files/report-print.css">
  <style>
    @media print {
      #app-header, .no-print { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="container-fluid py-4" data-report-view="cashier">
  <div id="app-header"></div>

  <main>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 no-print">
      <div>
        <h2 class="mb-1">Shift Report</h2>
        <p class="mb-0">Review paid-at-sale and AR sales separately, plus voids, cash drops, and drawer reconciliation for each shift.</p>
      </div>
      <a href="pos.html" id="back-pos" class="btn btn-dark d-none">&larr; Back to POS</a>
    </div>

    <section class="card bg-dark text-light border-secondary mb-4">
      <div class="card-body">
        <h3 class="h5">Register shifts</h3>
        <div class="row g-2 align-items-end mb-3 no-print d-none" id="shift-date-controls">
          <div class="col-12 col-sm-auto">
            <label for="shiftFrom" class="form-label">Opened from</label>
            <input type="date" id="shiftFrom" class="form-control">
          </div>
          <div class="col-12 col-sm-auto">
            <label for="shiftTo" class="form-label">Opened to</label>
            <input type="date" id="shiftTo" class="form-control">
          </div>
          <div class="col-12 col-sm-auto d-flex gap-2">
            <button type="button" id="shiftBtn" class="btn btn-primary">Generate</button>
          </div>
        </div>
        <div class="row g-2 align-items-end mb-3 no-print d-none" id="shift-filter-controls" role="group" aria-label="Filter register shifts">
          <div class="col-12 col-md-4">
            <label for="shiftTerminal" class="form-label">Terminal</label>
            <select id="shiftTerminal" class="form-select">
              <option value="">All terminals</option>
            </select>
          </div>
          <div class="col-12 col-md-4">
            <label for="shiftCashier" class="form-label">Search cashier</label>
            <input type="search" id="shiftCashier" class="form-control" placeholder="Enter cashier name">
          </div>
          <div class="col-12 col-md-4">
            <label for="shiftStatus" class="form-label">Shift status</label>
            <select id="shiftStatus" class="form-select">
              <option value="">All shifts</option>
              <option value="open">Open</option>
              <option value="closed">Closed</option>
            </select>
          </div>
        </div>
        <div class="d-flex justify-content-end mb-3 no-print">
          <button type="button" id="printBtn" class="btn btn-secondary">Print</button>
        </div>
        <div id="shift-div"></div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../js_functional/session.js"></script>
  <script type="module" src="../../js_functional/shift_report.js"></script>
</body>
</html>
