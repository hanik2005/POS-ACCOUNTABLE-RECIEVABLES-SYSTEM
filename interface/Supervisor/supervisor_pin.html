<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supervisor PIN - POS &amp; AR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../Design/Master_Files/style.css" rel="stylesheet">
  <link href="../Design/Functional_Files/sweetalert-dark.css" rel="stylesheet">
</head>
<body>
  <div id="app-header"></div>

  <main class="container-fluid">
    <div class="content">
      <section class="card mb-4">
        <div class="card-body">
          <div class="dashboard-section-title">Supervisor settings</div>
          <h2 class="page-title mt-2 mb-1">Update supervisor PIN</h2>
          <p class="page-subtitle mb-4">
            Re-enter your account password to set a unique 4-6 digit PIN for POS voids and cash drawer actions.
          </p>
          <form id="supervisor-pin-form" class="row g-3">
            <div class="col-12 col-lg-6">
              <label for="current-password" class="form-label">Account password</label>
              <input id="current-password" name="password" type="password" class="form-control"
                autocomplete="current-password" required>
            </div>
            <div class="col-12 col-lg-6">
              <label for="new-pin" class="form-label">New PIN</label>
              <input id="new-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}"
                minlength="4" maxlength="6" class="form-control" autocomplete="off" required>
            </div>
            <div class="col-12 col-lg-6">
              <label for="confirm-pin" class="form-label">Confirm new PIN</label>
              <input id="confirm-pin" name="confirmPin" type="password" inputmode="numeric" pattern="[0-9]{4,6}"
                minlength="4" maxlength="6" class="form-control" autocomplete="off" required>
            </div>
            <div class="col-12">
              <div id="pin-status" class="mb-0" role="alert" aria-live="polite"></div>
              <button id="save-pin" type="submit" class="btn btn-primary">Update PIN</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../js_functional/session.js"></script>
  <script type="module" src="../../js_functional/supervisor_pin.js"></script>
</body>
</html>
