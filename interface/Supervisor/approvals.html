<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supervisor Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Design/Functional_Files/functional.css">
  <link rel="stylesheet" href="../Design/Functional_Files/supervisor.css">

<body class="container py-4 supervisor-page">
  <div id="app-header"></div>
  <main>
    <div class="mb-4">
      <h2>Supervisor Home</h2>
      <p>Review and decide cashier requests.</p>
    </div>
    <div class="row g-3 supervisor-links">
      <div class="col-12 col-lg-6">
        <a class="card supervisor-link-card h-100" href="cash_drawer_requests.html">
          <div class="card-body">
            <h4>Cash drawer requests</h4>
            <p class="mb-0">Review float adjustments and cash drops. After approval, handle the cash at the cashier terminal.</p>
          </div>
        </a>
      </div>
      <div class="col-12 col-lg-6">
        <a class="card supervisor-link-card h-100" href="paid_sale_void_requests.html">
          <div class="card-body">
            <h4>Paid sale void requests</h4>
            <p class="mb-0">Review cashier requests to void a completed sale and its invoice.</p>
          </div>
        </a>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../../js_functional/session.js"></script>
