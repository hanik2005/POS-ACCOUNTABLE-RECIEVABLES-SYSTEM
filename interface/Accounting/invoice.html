<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accounts Receivable</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Design/Functional_Files/functional.css">
</head>
<body class="container py-4">
  <div id="app-header"></div>
  <h3>Accounts Receivable</h3>
  <h5>Total Receivable: <span id="totalReceivable">₱0.00</span></h5>
  <input type="text" id="searchInvoice" class="form-control mb-2" placeholder="Search invoice, customer, status">
  <div id="main-div"></div>
  <div class="modal fade" id="paymentModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Receive Payment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1"><b id="payment-invoice"></b></p>
          <p>Balance: <b id="payment-balance"></b></p>
          <input type="number" step="0.01" min="0.01" id="payment-amount" class="form-control mb-2" placeholder="Amount">
          <select id="payment-method" class="form-select mb-2"></select>
          <input type="text" id="payment-reference" class="form-control mb-2" placeholder="Reference number (optional)">
          <input type="text" id="payment-remarks" class="form-control" placeholder="Remarks (optional)">
        </div>
        <div class="modal-footer">
          <button type="button" id="button-save-payment" class="btn btn-primary">SAVE PAYMENT</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../../js_functional/session.js"></script>
  <script type="module" src="../../js_functional/invoice.js"></script>
</body>
</html>
