<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift Report - POS &amp; AR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../Design/Master_Files/style.css" rel="stylesheet">
  <link href="../../Design/Functional_Files/sweetalert-dark.css" rel="stylesheet">
  <link href="../../Design/Functional_Files/shift-report.css" rel="stylesheet">
  <link href="../../Design/Functional_Files/report-print.css" rel="stylesheet">
  <style>
    @media print {
      .navbar,
      .no-print {
        display: none !important;
      }

      body {
        background: #fff !important;
        color: #000 !important;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="invoice.html">POS &amp; AR INC</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto mt-2">
          <li class="nav-item"><a class="nav-link" href="../dashboard.html">Dashboard</a></li>
          <li class="nav-item">
            <a class="nav-link" href="invoice.html">Accounts Receivable</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="aging_report.html">Aging Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="sales_report.html">Sales Report</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="pos_activity_report.html">POS Activity</a></li>
          <li class="nav-item">
            <a class="nav-link" href="credit_limit_report.html">Credit Limit Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="shift_report.html">Shift Report</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="daily_report.html">Daily Z-Report</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container-fluid">
    <div class="content">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4 no-print">
        <div>
          <div class="dashboard-section-title">Reports</div>
          <h2 class="page-title mt-2 mb-1">Shift Report</h2>
          <p class="page-subtitle mb-0">
            Review sales, AR activity, voids and cash reconciliation for each shift.
          </p>
        </div>
        <a href="../Cashier/pos.html" id="back-pos" class="btn btn-secondary d-none">
          Back to POS
        </a>
      </div>
      <section class="card mb-4">
        <div class="card-body">
          <h3 class="h5 page-title">Register shifts</h3>
          <div class="row g-2 align-items-end mb-3 no-print">
            <div class="col-12 col-sm-auto">
              <label for="shiftFrom" class="form-label">Opened from</label>
              <input type="date" id="shiftFrom" class="form-control">
            </div>
            <div class="col-12 col-sm-auto">
              <label for="shiftTo" class="form-label">Opened to</label>
              <input type="date" id="shiftTo" class="form-control">
            </div>
            <div class="col-12 col-sm-auto d-flex gap-2">
              <button type="button" id="shiftBtn" class="btn btn-primary">Generate</button>
              <button type="button" id="printBtn" class="btn btn-secondary">Print</button>
            </div>
          </div>
          <div class="row g-2 align-items-end mb-3 no-print" role="group" aria-label="Filter register shifts">
            <div class="col-12 col-md-3">
              <label for="shiftTerminal" class="form-label">Terminal</label>
              <select id="shiftTerminal" class="form-select">
                <option value="">All terminals</option>
              </select>
            </div>
            <div class="col-12 col-md-3">
              <label for="shiftCashier" class="form-label">Search cashier</label>
              <input type="search" id="shiftCashier" class="form-control" placeholder="Enter cashier name">
            </div>
            <div class="col-12 col-md-3">
              <label for="shiftStatus" class="form-label">Shift status</label>
              <select id="shiftStatus" class="form-select">
                <option value="">All shifts</option>
                <option value="open">Open</option>
                <option value="closed">Closed</option>
              </select>
            </div>
            <div class="col-12 col-md-3">
              <label for="shiftAccountingAr" class="form-label">Accounting AR activity</label>
              <select id="shiftAccountingAr" class="form-select">
                <option value="include">Include</option>
                <option value="exclude">Exclude</option>
              </select>
            </div>
          </div>
          <div id="shift-div"></div>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../../../js_functional/session.js"></script>
  <script type="module" src="../../../js_functional/shift_report.js"></script>
</body>
</html>
