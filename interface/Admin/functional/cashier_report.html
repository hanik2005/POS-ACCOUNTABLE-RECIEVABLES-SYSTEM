<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cashier Report - POS &amp; Accounts Receivable System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../Design/Master_Files/style.css" rel="stylesheet">
  <style>@media print { .navbar, .no-print { display: none !important; } }</style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="../dashboard.html">POS &amp; AR INC</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto mt-2">
            <li class="nav-item"><a class="nav-link" href="../dashboard.html">Back Master in the Files</a></li>
            <li class="nav-item"><a class="nav-link active" href="invoice.html">Accounts Receivable</a></li>
            <li class="nav-item"><a class="nav-link" href="sales_report.html">Sales Report</a></li>
            <li class="nav-item"><a class="nav-link" href="cashier_report.html">Cashier Report</a></li>
            <li class="nav-item"><a class="nav-link" href="credit_limit_report.html">Credit Limit Report</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container-fluid">
    <div class="content">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4 no-print">
        <div><div class="dashboard-section-title">Reports</div><h2 class="page-title mt-2 mb-1">Cashier Report</h2><p class="page-subtitle mb-0">Review shift totals, daily sales and drawer differences.</p></div>
        <a href="../../../interface/Cashier/pos.html" id="back-pos" class="btn btn-secondary d-none">Back to POS <span class="badge bg-light text-dark ms-2">Esc</span></a>
      </div>
      <div class="card mb-4"><div class="card-body">
        <div class="d-flex flex-wrap align-items-end gap-2 mb-3 no-print">
          <div><label for="shiftFrom" class="form-label">Shift from</label><input type="date" id="shiftFrom" class="form-control"></div>
          <div><label for="shiftTo" class="form-label">Shift to</label><input type="date" id="shiftTo" class="form-control"></div>
          <button type="button" id="shiftBtn" class="btn btn-primary">Generate Shifts</button>
          <button type="button" id="printBtn" class="btn btn-secondary">Print</button>
        </div>
        <div class="table-responsive" id="shift-div"></div>
      </div></div>
      <div class="card"><div class="card-body">
        <div class="d-flex flex-wrap align-items-end gap-2 mb-3 no-print">
          <div><label for="dailyDate" class="form-label">Daily date</label><input type="date" id="dailyDate" class="form-control"></div>
          <button type="button" id="dailyBtn" class="btn btn-primary">Generate Daily Report</button>
        </div>
        <div class="table-responsive" id="daily-div"></div>
      </div></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../../js_functional/session.js"></script>
  <script type="module" src="../../../js_functional/cashier_report.js"></script>
</body>
</html>
