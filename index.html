<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>POS & Accounts Receivable Management System - Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="interface/Design/Master_Files/login.css" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script type="module" src="js/main.js" defer></script>
</head>

<body class="login-page">
  <main class="login-shell container">
    <section class="login-card">
      <div class="login-brand-panel">
        <div class="brand-mark" aria-hidden="true">P<span>+</span></div>
        <p class="brand-eyebrow">POS &amp; AR INC</p>
        <h1>One view for daily operations.</h1>
        <p class="brand-copy">Manage sales, customers and receivables with a clear view of your business.</p>
        <div class="brand-status"><span></span> BUSINESS PORTAL</div>
      </div>

      <div class="login-form-panel">
        <div class="login-heading">
          <p class="form-eyebrow">WELCOME BACK</p>
          <h2>Sign in</h2>
          <p>Use your authorized account to continue.</p>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter your username" autocomplete="username" />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password" />
        </div>

        <div id="login-message" class="alert d-none" role="alert"></div>
        <div class="d-grid mt-4">
          <button type="button" class="btn btn-primary" id="button-login">Sign in <span aria-hidden="true">→</span></button>
        </div>

        <div class="login-footnote">AUTHORIZED USERS ONLY <span>•</span> POS &amp; ACCOUNTS RECEIVABLE</div>
      </div>
    </section>
  </main>

</body>
</html>
